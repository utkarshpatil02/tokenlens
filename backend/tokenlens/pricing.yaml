# TokenLens rate table
#
# All rates are USD per 1,000,000 tokens.
#
# Cache rates are derived from the base input rate, not invented:
#   cache_read      = 0.10 x input
#   cache_write_5m  = 1.25 x input   (5-minute TTL)
#   cache_write_1h  = 2.00 x input   (1-hour TTL)
# They are written out explicitly so a provider that breaks the ratio can be
# represented without special-casing the engine.
#
# `tier` is the model-capability tier the Waste Score compares against:
#   1 = small/cheap, 2 = mid, 3 = frontier
#
# Sources: Anthropic pricing as of the `updated` date below; OpenAI list prices.
# Re-verify before publishing any dollar figure.

version: 1
updated: 2026-07-26
currency: USD
unit: per_million_tokens

models:
  # --- Anthropic ---------------------------------------------------------
  claude-opus-5:
    tier: 3
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00

  claude-opus-4-8:
    tier: 3
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00

  claude-sonnet-5:
    tier: 2
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00
    # Introductory pricing, active through 2026-08-31. The engine applies these
    # rates when the call timestamp falls inside the window.
    promotional:
      until: 2026-08-31
      input: 2.00
      output: 10.00
      cache_read: 0.20
      cache_write_5m: 2.50
      cache_write_1h: 4.00

  claude-sonnet-4-6:
    tier: 2
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00

  claude-haiku-4-5:
    tier: 1
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write_5m: 1.25
    cache_write_1h: 2.00

  # --- OpenAI (simple profile / imported logs) ---------------------------
  # No 5m/1h TTL distinction; the single cached-input rate is used for both.
  gpt-4o:
    tier: 2
    input: 2.50
    output: 10.00
    cache_read: 1.25
    cache_write_5m: 2.50
    cache_write_1h: 2.50

  gpt-4o-mini:
    tier: 1
    input: 0.15
    output: 0.60
    cache_read: 0.075
    cache_write_5m: 0.15
    cache_write_1h: 0.15

# The model each tier is priced against when answering "what should this have
# cost". Overshoot is the difference between what a call actually cost and what
# the same tokens would have cost on the reference model for the required tier,
# so the counterfactual is a named model rather than an abstract discount.
tier_reference:
  1: claude-haiku-4-5
  2: claude-sonnet-5
  3: claude-opus-5

# Prefix rules for models absent from the table above, so a newly released
# point version still prices instead of raising. Longest prefix wins.
prefix_fallbacks:
  claude-opus-: claude-opus-5
  claude-sonnet-: claude-sonnet-5
  claude-haiku-: claude-haiku-4-5
  gpt-4o-mini: gpt-4o-mini
  gpt-4o: gpt-4o
