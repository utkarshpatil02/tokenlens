name: Deploy dashboard

# Publishes the dashboard to GitHub Pages. The site is static: it serves the
# committed snapshot.json, since analysis reads local session logs that exist
# only on the machine that produced them.
#
# The snapshot is regenerated locally and committed deliberately, never built
# here — this runner has no logs to read, and generating one in CI would be the
# obvious place to accidentally publish unredacted prompt text.

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The Vite toolchain requires 20.19+ or 22.12+; on anything older npm
          # silently skips rolldown's native binding and the build fails with an
          # unrelated-looking MODULE_NOT_FOUND.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Verify the published snapshot carries no prompt text
        working-directory: frontend
        run: |
          test -f dist/snapshot.json
          node -e "
            const s = require('./dist/snapshot.json');
            if (!s.snapshot?.static) throw new Error('snapshot is not marked static');
            for (const row of s.waste?.leaderboard ?? []) {
              for (const key of ['prompt', 'rationale']) {
                const v = row[key];
                if (v && !v.includes('redact') && v !== '(no prompt text)') {
                  throw new Error('unredacted ' + key + ' would be published');
                }
              }
            }
            console.log('snapshot ok:', s.overview.calls, 'requests');
          "

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
